spring.application.name=tahti-fnol-transcript
spring.main.banner-mode=off
spring.threads.virtual.enabled=true
# 8080 is commonly taken by the tahti Docker stack on the dev host
server.port=${SERVER_PORT:8090}

# Custom config
app.mcp.server.jar=${APP_MCP_SERVER_JAR:tahti-mcp-server.jar}
app.log.poll-interval-ms=5000
app.workflow.username=KAUR
app.workflow.user-number=9934

# Policy data (tahti-rest-app) used by the FNOL tool-set; the client appends /tahti-data/...
app.tahti.base-url=${TAHTI_REST_URL:http://localhost:8085/tahti-rest-app}
app.tahti.timeout=15s
# Insurance ontology (pcpc-rest-app): /branch/{branch}/entities is ~0.5 MB and near-static -> cached
app.pcpc.base-url=${PCPC_REST_URL:http://localhost:8080/pcpc-rest-app}
app.pcpc.branch=${PCPC_BRANCH:tahti4devTEST20260921}
app.pcpc.cache-ttl=1h
app.pcpc.timeout=30s

# Claim advisor agent (gpt-5.4 + tools) runs after every transcribed segment
app.advisor.enabled=${APP_ADVISOR_ENABLED:true}
app.advisor.closing-phrase=Kiitos, otamme teihin pian yhteyttä.
# gpt-5 family reasoning_effort (minimal|low|medium|high); blank = deployment default
app.advisor.reasoning-effort=${APP_ADVISOR_REASONING:}
app.advisor.extraction-reasoning-effort=${APP_ADVISOR_EXTRACTION_REASONING:}
app.advisor.max-questions-per-round=4

# Audio ingest (see docs/audio-ws-protocol.md)
app.audio.storage-dir=${APP_AUDIO_STORAGE_DIR:recordings}
app.audio.default-sample-rate=16000
# 0 = only transcribe on the client's "transcribe" command; N>0 = also auto-cut every N seconds
app.audio.auto-segment-seconds=0
# Safety cap so an unbounded segment cannot exhaust memory (audio API limit is 25 MB ~ 13 min at 16 kHz)
app.audio.max-segment-seconds=600
# Segments shorter than this are stored but not sent to the model
app.audio.min-transcribe-millis=400

# Transcription
app.transcription.language=fi
# Domain vocabulary bias for the transcription model (insurance terms, Finnish place names,
# and the expected written form of a henkilotunnus so spoken digits come back as one token)
app.transcription.prompt=Vahinkoilmoitus. Vakuutus, omavastuu, vakuutustunnus, vakuutusnumero, kasko, liikennevakuutus, kotivakuutus, korvaus, vahinkopaikka, rekisterinumero. Henkilötunnus muodossa 010190-123A. Suomalaisia paikannimia ja kadunnimia.

# Azure OpenAI - never commit the key; provide AZURE_OPENAI_API_KEY in the environment
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY}
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:https://tahti-foundry.cognitiveservices.azure.com}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_CHAT_DEPLOYMENT:gpt-5.4}
spring.ai.azure.openai.chat.options.temperature=1.0

# Speech-to-text deployment in AI Foundry (classic Azure OpenAI /audio/transcriptions API).
# Default is a gpt-4o-mini-transcribe deployment (Global Standard; Whisper Standard quota is
# not available in swedencentral). Any deployment on the same API works: gpt-4o-transcribe, whisper.
spring.ai.model.audio.transcription=${SPRING_AI_TRANSCRIPTION:azure-openai}
spring.ai.azure.openai.audio.transcription.options.deployment-name=${AZURE_TRANSCRIBE_DEPLOYMENT:gpt-4o-mini-transcribe}
spring.ai.azure.openai.audio.transcription.options.language=${app.transcription.language}
# gpt-4o-*-transcribe only support json|text (no verbose_json/srt/vtt)
spring.ai.azure.openai.audio.transcription.options.response-format=text
spring.ai.azure.openai.audio.transcription.options.temperature=0

logging.level.ee.evitec.tahti=INFO
