spring.application.name=tahti-fnol-transcript
spring.main.banner-mode=off
spring.threads.virtual.enabled=true
# 8080 is commonly taken by the tahti Docker stack on the dev host
server.port=${SERVER_PORT:8090}

# Custom config
app.mcp.server.jar=${APP_MCP_SERVER_JAR:tahti-mcp-server.jar}
app.log.poll-interval-ms=5000
app.workflow.username=KAUR
app.workflow.user-number=9934

# Audio ingest (see docs/audio-ws-protocol.md)
app.audio.storage-dir=${APP_AUDIO_STORAGE_DIR:recordings}
app.audio.default-sample-rate=16000
# 0 = only transcribe on the client's "transcribe" command; N>0 = also auto-cut every N seconds
app.audio.auto-segment-seconds=0
# Safety cap so an unbounded segment cannot exhaust memory (Whisper limit is 25 MB ~ 13 min at 16 kHz)
app.audio.max-segment-seconds=600
# Segments shorter than this are stored but not sent to the model
app.audio.min-transcribe-millis=400

# Transcription
app.transcription.language=fi
# Domain vocabulary bias for Whisper (helps with insurance terms and Finnish place names)
app.transcription.prompt=Vahinkoilmoitus. Vakuutus, omavastuu, vakuutustunnus, vakuutusnumero, kasko, liikennevakuutus, kotivakuutus, korvaus, vahinkopaikka, rekisterinumero. Suomalaisia paikannimia ja kadunnimia.

# Azure OpenAI - never commit the key; provide AZURE_OPENAI_API_KEY in the environment
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY}
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:https://tahti-foundry.cognitiveservices.azure.com}
spring.ai.azure.openai.chat.options.deployment-name=gpt-5.4
spring.ai.azure.openai.chat.options.temperature=1.0

# Whisper-class deployment in AI Foundry (classic Azure OpenAI audio API)
spring.ai.model.audio.transcription=${SPRING_AI_TRANSCRIPTION:azure-openai}
spring.ai.azure.openai.audio.transcription.options.deployment-name=${AZURE_WHISPER_DEPLOYMENT:whisper}
spring.ai.azure.openai.audio.transcription.options.language=${app.transcription.language}
spring.ai.azure.openai.audio.transcription.options.response-format=text
spring.ai.azure.openai.audio.transcription.options.temperature=0

logging.level.ee.evitec.tahti=INFO
